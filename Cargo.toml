[package]
name = "thunk"
version = "0.18.64"
edition = "2021"

[dependencies]
crossterm = "0.28"
unicode-width = "0.1"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
llama-cpp-2 = { version = "=0.1.143", optional = true }
llama-cpp-sys-2 = { version = "=0.1.143", optional = true }
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
ureq = { version = "2", features = ["tls"] }

[features]
local = ["llama-cpp-2", "llama-cpp-sys-2"]
default = ["local"]

[dev-dependencies]
tempfile = "3"
